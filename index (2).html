<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paso a Paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #FFE14D;
    --panel: #FFC4DD;
    --surface: #FFF4A8;
    --ink: #6B0A3C;
    --muted: #A0306A;
    --line: #F58BB8;
    --accent: #D10A63;
    --accent-ink: #FFF4A8;
    --accent-soft: #FF8FC0;
    --stamp: #D10A63;
    --gold: #F5B700;
    --highlight: #FF8FC0;
    --good: #D10A63;
    --good-soft: #FFE14D;
    --bad: #6B0A3C;
    --bad-soft: #FF8FC0;
    --shadow: 0 1px 2px rgba(107,10,60,.10), 0 10px 28px rgba(209,10,99,.18);
    --display: "Young Serif", Georgia, "Times New Roman", serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    padding: 0 16px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding-block: 24px 48px; display: grid; gap: 20px; }

  header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
  .brand h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 6vw, 38px); line-height: 1.1; margin: 0; letter-spacing: -.01em; }
  .brand h1 span { background: linear-gradient(transparent 58%, var(--highlight) 58%, var(--highlight) 92%, transparent 92%); padding: 0 .08em; }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .stats { display: flex; gap: 16px; font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 500; font-size: 18px; display: block; line-height: 1.1; }


  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .tabs { display: flex; gap: 2px; background: var(--line); padding: 3px; border-radius: 10px; flex-wrap: wrap; }
  .tab { font: inherit; font-size: 14px; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(107,10,60,.15); }
  .tab { color: var(--ink); }
  select {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 10px;
  }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 32px); display: grid; gap: 20px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  /* Flashcard */
  .card {
    position: relative; min-height: 220px; border-radius: 12px;
    border: 1.5px dashed var(--line); display: grid; place-items: center; text-align: center;
    padding: 28px 16px; cursor: pointer; user-select: none;
  }
  .card .word { font-family: var(--display); font-size: clamp(32px, 8vw, 50px); line-height: 1.15; overflow-wrap: anywhere; }
  .card .meaning { margin-top: 10px; font-size: 18px; color: var(--muted); }
  .card .hint { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .stampmark {
    position: absolute; top: 12px; right: 12px; transform: rotate(8deg);
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--stamp); border: 2px solid var(--stamp); border-radius: 6px; padding: 2px 7px; opacity: .85;
  }
  .speak {
    font: inherit; font-size: 13px; font-weight: 600; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .speak svg { width: 14px; height: 14px; fill: currentColor; }

  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .btn {
    font: inherit; font-weight: 600; font-size: 15px; border-radius: 10px; padding: 12px 10px; cursor: pointer;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .btn small { display: block; font-family: var(--mono); font-weight: 500; font-size: 11px; color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary small { color: inherit; opacity: .8; }
  .btn.again { border-color: var(--bad); color: var(--bad); }
  .btn:disabled { opacity: .45; cursor: default; }

  /* Quiz */
  .prompt { text-align: center; display: grid; gap: 8px; justify-items: center; }
  .prompt .word { font-family: var(--display); font-size: clamp(28px, 7vw, 42px); line-height: 1.2; overflow-wrap: anywhere; }
  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .opt {
    font: inherit; font-size: 16px; font-weight: 500; text-align: left;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 10px; padding: 14px 14px; cursor: pointer; display: flex; gap: 10px; align-items: baseline;
  }
  .opt .k { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; flex: none; }
  .opt.right { border-color: var(--good); background: var(--good-soft); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong span:last-child { text-decoration: line-through; }
  .opt:disabled { cursor: default; }

  .feedback { min-height: 24px; text-align: center; font-weight: 600; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  /* Typing */
  .typebox { display: flex; gap: 10px; flex-wrap: wrap; }
  .typebox input {
    flex: 1 1 220px; font: inherit; font-size: 20px; color: var(--ink); background: var(--ground);
    border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0;
  }
  .typebox input.good { border-color: var(--good); }
  .typebox input.bad { border-color: var(--bad); }
  .accents { display: flex; flex-wrap: wrap; gap: 6px; }
  .accents button { font: inherit; font-size: 15px; min-width: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 8px; cursor: pointer; }

  /* Progress */
  .topics { display: grid; gap: 14px; }
  .topic { display: grid; grid-template-columns: minmax(110px, 160px) 1fr auto; gap: 12px; align-items: center; }
  .topic .name { font-weight: 600; }
  .bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
  .bar span { display: block; height: 100%; }
  .topic .num { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  td.box { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .tablewrap { overflow-x: auto; max-height: 360px; overflow-y: auto; }
  .reset { justify-self: start; font: inherit; font-size: 13px; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; }
  .confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; }

  /* Alphabet */
  .subtabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .subtab { font: inherit; font-size: 13px; font-weight: 600; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 5px 14px; cursor: pointer; }
  .subtab[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; }
  .letter {
    position: relative; font-family: var(--display); font-size: 26px; line-height: 1; aspect-ratio: 1; max-width: 100%;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer;
    display: grid; place-items: center;
  }
  .letter.special { color: var(--stamp); }
  .letter[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .letter .dot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .letter .dot.learning { background: var(--gold); }
  .letter .dot.known { background: var(--accent); }
  .detail { display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; align-items: start; border-top: 1px solid var(--line); padding-top: 20px; }
  .detail .big { font-family: var(--display); font-size: clamp(64px, 16vw, 96px); line-height: 1; grid-row: span 2; }
  .detail .name { font-family: var(--display); font-size: 26px; line-height: 1.2; }
  .detail .name small { font-family: var(--body); font-size: 14px; color: var(--muted); margin-left: 6px; }
  .detail dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 15px; grid-column: 1 / -1; }
  .detail dt { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
  .detail dd { margin: 0; }
  .detail dd b { font-weight: 600; }
  .detail .say { display: flex; flex-wrap: wrap; gap: 8px; align-self: center; }
  .digraphs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .digraph { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; font-size: 14px; display: grid; gap: 4px; }
  .digraph b { font-family: var(--display); font-weight: 400; font-size: 22px; }
  .digraph span { color: var(--muted); }
  .opt.letteropt { font-family: var(--display); font-size: 28px; justify-content: flex-start; align-items: center; }
  .opt.letteropt .k { font-family: var(--mono); }

  .tip { font-size: 14px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px; text-align: left; }
  .tip b { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-right: 6px; }
  .card .tip { margin-top: 16px; max-width: 46ch; }

  .empty { text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; padding: 20px 0; }
  .empty h3 { font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--ink); margin: 0; }
  .note { font-size: 13px; color: var(--muted); }

  @media (max-width: 480px) {
    .options { grid-template-columns: 1fr; }
    .topic { grid-template-columns: 1fr auto; }
    .topic .bar { grid-column: 1 / -1; grid-row: 2; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .card, .opt, .btn, .lang { transition: background-color .15s, border-color .15s, transform .15s; }
    .btn:active, .opt:active { transform: scale(.98); }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Paso a <span>Paso</span></h1>
      <p>Spanish for English speakers, step by step. A few minutes a day is enough.</p>
    </div>
    <div class="stats" aria-label="Your progress">
      <div><b id="statDue">0</b>due today</div>
      <div><b id="statLearned">0</b>learned</div>
      <div><b id="statStreak">0</b>day streak</div>
    </div>
  </header>

  <div class="row">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-mode="cards" aria-selected="true">Flashcards</button>
      <button class="tab" role="tab" data-mode="quiz" aria-selected="false">Quiz</button>
      <button class="tab" role="tab" data-mode="type" aria-selected="false">Spell it</button>
      <button class="tab" role="tab" data-mode="alphabet" aria-selected="false" id="alphaTab">Alphabet</button>
      <button class="tab" role="tab" data-mode="progress" aria-selected="false">Progress</button>
    </div>
    <select id="topic" aria-label="Topic"></select>
  </div>

  <main class="panel" id="panel" aria-live="polite"></main>

  <p class="note">Tip: press Space to flip a card, 1 2 3 to rate it, 1 to 4 to pick a quiz answer, and ← → to move through the alphabet. Progress is saved in this browser.</p>
</div>

<script>
(function () {
  "use strict";

  // ---------- Languages ----------
  var LANGS = {
    es: { name: "Spanish", code: "ES", voice: "es-ES", accents: ["á","é","í","ó","ú","ñ","ü","¿","¡"] }
  };

  // ---------- Vocabulary: [english, spanish, tip for English speakers] ----------
  // Nouns carry el/la because Spanish nouns have a gender that English doesn't.
  var TOPICS = {
    "Greetings": [
      ["hello", "hola", "The h is always silent: say “OH-lah”."],
      ["goodbye", "adiós"],
      ["please", "por favor"],
      ["thank you", "gracias", "Say “GRAH-see-ahs” (or “GRAH-thee-ahs” in Spain)."],
      ["yes", "sí", "The accent matters: sí means yes, si means if."],
      ["no", "no"],
      ["excuse me / sorry", "perdón"],
      ["good morning", "buenos días", "It's plural in Spanish, literally “good days”."],
      ["good night", "buenas noches", "Also used for “good evening” once it's dark."],
      ["how are you?", "¿cómo estás?", "Spanish questions open with an upside-down ¿."],
      ["nice to meet you", "mucho gusto"],
      ["my name is...", "me llamo...", "Literally “I call myself...”. The ll sounds like y."]
    ],
    "Food & drink": [
      ["water", "el agua", "Agua is feminine but takes el, because it starts with a stressed a."],
      ["coffee", "el café"],
      ["bread", "el pan"],
      ["cheese", "el queso", "The u is silent: “KEH-so”."],
      ["fish (to eat)", "el pescado", "A live fish is el pez. On your plate it's el pescado."],
      ["chicken", "el pollo", "ll sounds like y: “POH-yo”."],
      ["rice", "el arroz", "rr is a strong rolled r."],
      ["the bill, please", "la cuenta, por favor"],
      ["delicious", "delicioso"],
      ["breakfast", "el desayuno"],
      ["I would like...", "quisiera...", "A polite way to order, softer than quiero (I want)."]
    ],
    "Travel": [
      ["beach", "la playa"],
      ["hotel", "el hotel", "The h is silent: “oh-TEL”."],
      ["train station", "la estación de tren"],
      ["airport", "el aeropuerto"],
      ["ticket", "el billete", "In Latin America you'll often hear el boleto."],
      ["where is...?", "¿dónde está...?", "Locations always use estar, never ser."],
      ["left", "izquierda", "Think “is-key-AIR-dah”."],
      ["right", "derecha", "Careful: derecho means “straight on”."],
      ["room", "la habitación"],
      ["key", "la llave"]
    ],
    "Numbers": [
      ["one", "uno", "Shortens to un before a masculine noun: un café."],
      ["two", "dos"],
      ["three", "tres", "Tap the r quickly, like the tt in “butter”."],
      ["four", "cuatro"],
      ["five", "cinco"],
      ["six", "seis", "Rhymes with “case”."],
      ["seven", "siete"],
      ["eight", "ocho"],
      ["nine", "nueve"],
      ["ten", "diez"]
    ],
    "Everyday": [
      ["today", "hoy", "Silent h again: sounds like “oy”."],
      ["tomorrow", "mañana", "Also means “morning”. Tomorrow morning is mañana por la mañana."],
      ["friend", "el amigo", "A female friend is la amiga."],
      ["house", "la casa"],
      ["big", "grande"],
      ["small", "pequeño"],
      ["hot", "caliente", "For the weather say hace calor (“it makes heat”)."],
      ["cold", "frío"],
      ["I don't understand", "no entiendo", "Spanish puts no in front of the verb. No need for “do”."],
      ["how much is it?", "¿cuánto cuesta?"]
    ],
    "Verbs": [
      ["to be (who or what)", "ser", "For identity and lasting traits: soy australiano (I'm Australian)."],
      ["to be (how or where)", "estar", "For feelings and locations: estoy cansado (I'm tired)."],
      ["to have", "tener", "Also used for age: tengo treinta años, “I have thirty years”."],
      ["to go", "ir"],
      ["to want", "querer"],
      ["to speak", "hablar", "Silent h: “ah-BLAR”."],
      ["to eat", "comer"],
      ["to live", "vivir", "b and v sound the same in Spanish."],
      ["to need", "necesitar"],
      ["to like", "gustar", "Works backwards: me gusta el café means “coffee pleases me”."]
    ],
    "Questions": [
      ["what?", "¿qué?"],
      ["where?", "¿dónde?"],
      ["when?", "¿cuándo?"],
      ["who?", "¿quién?"],
      ["why?", "¿por qué?", "Written as one word with no accent, porque means “because”."],
      ["how?", "¿cómo?"],
      ["how much?", "¿cuánto?"],
      ["which?", "¿cuál?"]
    ],
    "False friends": [
      ["pregnant", "embarazada", "Not “embarrassed”! That's avergonzado."],
      ["success", "el éxito", "Not “exit”. The way out is la salida."],
      ["bookshop", "la librería", "A library is la biblioteca."],
      ["current, present-day", "actual", "“Actually” is en realidad."],
      ["sensitive", "sensible", "“Sensible” in English is sensato."],
      ["to carry out", "realizar", "Not “realise”. To realise is darse cuenta."],
      ["folder", "la carpeta", "A carpet is la alfombra."],
      ["clothes", "la ropa", "Rope is la cuerda."],
      ["to attend", "asistir", "Not “assist”. To help is ayudar."],
      ["having a cold", "constipado", "Not “constipated”! In Spain it means a stuffy cold."]
    ]
  };
  var LANG_INDEX = { es: 1 };

  // ---------- Spanish alphabet: [letter, name, how it sounds, example word, meaning, second example, meaning] ----------
  var ALPHABET = [
    ["A", "a", "<b>ah</b>, like the a in “father”. Always the same sound.", "agua", "water"],
    ["B", "be", "Like English b at the start of a word; softer, lips barely touching, between vowels.", "barco", "boat"],
    ["C", "ce", "<b>k</b> before a, o, u. Before e or i it's <b>th</b> in Spain or <b>s</b> in Latin America.", "casa", "house", "cena", "dinner"],
    ["D", "de", "Tongue touches the teeth. Between vowels it softens to the <b>th</b> in “this”.", "dedo", "finger"],
    ["E", "e", "<b>eh</b>, like the e in “bet”. Short and clean.", "elefante", "elephant"],
    ["F", "efe", "Just like English f.", "fruta", "fruit"],
    ["G", "ge", "Hard g (as in “go”) before a, o, u. Before e or i it's a raspy <b>h</b> from the throat.", "gato", "cat", "gente", "people"],
    ["H", "hache", "Always <b>silent</b>. Hola sounds like “ola”.", "hola", "hello"],
    ["I", "i", "<b>ee</b>, like the ee in “see”.", "isla", "island"],
    ["J", "jota", "A raspy <b>h</b> from the back of the throat, like the ch in Scottish “loch”.", "jugo", "juice"],
    ["K", "ka", "Like English k. Only found in borrowed words.", "kilo", "kilo"],
    ["L", "ele", "Like English l, with the tongue just behind the top teeth.", "luna", "moon"],
    ["M", "eme", "Just like English m.", "mesa", "table"],
    ["N", "ene", "Just like English n.", "noche", "night"],
    ["Ñ", "eñe", "<b>ny</b>, like the ny in “canyon”. A letter of its own, not an N with decoration.", "niño", "child"],
    ["O", "o", "<b>oh</b>, short and pure, with no “w” glide at the end.", "ojo", "eye"],
    ["P", "pe", "Like English p but without the puff of air.", "perro", "dog"],
    ["Q", "cu", "<b>k</b>. Always written <b>qu</b> and the u is silent.", "queso", "cheese"],
    ["R", "erre", "A quick tap of the tongue, like the tt in American “butter”. <b>Rolled</b> at the start of a word.", "pero", "but", "rojo", "red"],
    ["S", "ese", "<b>s</b>, like in “sun”. Never a z sound.", "sol", "sun"],
    ["T", "te", "Softer than English t: tongue touches the teeth, no puff of air.", "taza", "cup"],
    ["U", "u", "<b>oo</b>, like the oo in “food”. Silent in que, qui, gue, gui.", "uva", "grape"],
    ["V", "uve", "Sounds the <b>same as b</b> in Spanish.", "vaca", "cow"],
    ["W", "uve doble", "Like English w. Only found in borrowed words.", "wifi", "wifi"],
    ["X", "equis", "Usually <b>ks</b>. In some names like México it's a raspy h.", "taxi", "taxi"],
    ["Y", "ye", "Like the y in “yes”. On its own, y means “and” and sounds like <b>ee</b>.", "yo", "I"],
    ["Z", "zeta", "<b>th</b> as in “think” in Spain, <b>s</b> in Latin America.", "zapato", "shoe"]
  ];
  var DIGRAPHS = [
    ["ch", "Like ch in “church”.", "chocolate"],
    ["ll", "Like y in “yes” in most places.", "llave (key)"],
    ["rr", "A strong rolled r, only between vowels.", "perro (dog)"]
  ];
  var ALPHA_KNOWN = 3; // correct answers in a row to count a letter as known

  // ---------- Spaced repetition (Leitner boxes) ----------
  // Box 0 = new. Each correct answer moves the word up one box; a miss drops it back to box 1.
  var INTERVAL_DAYS = [0, 0, 1, 3, 7, 14, 30];
  var MAX_BOX = INTERVAL_DAYS.length - 1;
  var LEARNED_BOX = 3;
  var DAY = 86400000;

  // ---------- Storage (safe wrappers) ----------
  var KEY = "passport-phrasebook-v1";
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return null;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = load() || { lang: "es", mode: "cards", topic: "All topics", words: {}, days: [] };
  state.lang = "es";
  if (!state.words) state.words = {};
  if (!state.days) state.days = [];

  // Fresh visitors get a little sample progress in Spanish so the Progress tab shows what it does.
  if (!load()) {
    var seed = [["hello", 4], ["thank you", 3], ["please", 3], ["yes", 2], ["water", 2], ["coffee", 1], ["one", 3], ["two", 2]];
    var now0 = Date.now();
    seed.forEach(function (s, i) {
      state.words["es|" + s[0]] = { box: s[1], due: now0 + (i % 3 === 0 ? -DAY : DAY * INTERVAL_DAYS[s[1]]), seen: s[1] + 1, right: s[1] };
    });
  }

  // ---------- Helpers ----------
  function allWords(lang, topic) {
    var i = LANG_INDEX[lang];
    var out = [];
    Object.keys(TOPICS).forEach(function (t) {
      if (topic !== "All topics" && topic !== t) return;
      TOPICS[t].forEach(function (row) {
        out.push({ en: row[0], target: row[i], tip: row[2] || "", topic: t, id: lang + "|" + row[0] });
      });
    });
    return out;
  }
  function rec(id) { return state.words[id] || { box: 0, due: 0, seen: 0, right: 0 }; }
  function isDue(w) { var r = rec(w.id); return r.box > 0 && r.due <= Date.now(); }
  function isNew(w) { return rec(w.id).box === 0; }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function norm(s) {
    return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[¿¡?!.,'’\s-]+/g, " ").trim();
  }
  function strict(s) { return String(s).toLowerCase().replace(/[¿¡?!.,\s]+/g, " ").replace(/’/g, "'").trim(); }
  function todayKey() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }

  function grade(w, correct, easy) {
    var r = rec(w.id);
    r.seen = (r.seen || 0) + 1;
    if (correct) {
      r.right = (r.right || 0) + 1;
      r.box = Math.min(MAX_BOX, r.box + (easy ? 2 : 1));
    } else {
      r.box = 1;
    }
    r.due = Date.now() + INTERVAL_DAYS[r.box] * DAY;
    state.words[w.id] = r;
    var t = todayKey();
    if (state.days[state.days.length - 1] !== t) { state.days.push(t); if (state.days.length > 400) state.days.shift(); }
    save();
    renderStats();
  }

  function streak() {
    var set = {};
    state.days.forEach(function (d) { set[d] = true; });
    var n = 0, d = new Date();
    if (!set[todayKey()]) d.setDate(d.getDate() - 1);
    while (true) {
      var k = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
      if (!set[k]) break;
      n++; d.setDate(d.getDate() - 1);
    }
    return n;
  }

  // ---------- Speech ----------
  var ICON_SPEAK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>';
  var canSpeak = typeof window.speechSynthesis !== "undefined";
  function speak(text) {
    if (!canSpeak) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text.replace(/\.\.\./g, ""));
      u.lang = LANGS[state.lang].voice;
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  function tipHtml(w) { return w.tip ? '<div class="tip"><b>Tip</b>' + esc(w.tip) + '</div>' : ''; }
  function speakBtn(text) {
    if (!canSpeak) return "";
    return '<button class="speak" type="button" data-say="' + esc(text) + '">' + ICON_SPEAK + 'Listen</button>';
  }

  // ---------- Top controls ----------
  var $ = function (id) { return document.getElementById(id); };
  var panel = $("panel");

  function renderTopics() {
    var opts = ["All topics"].concat(Object.keys(TOPICS));
    $("topic").innerHTML = opts.map(function (t) {
      return '<option' + (t === state.topic ? " selected" : "") + '>' + esc(t) + '</option>';
    }).join("");
  }
  function renderTabs() {
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.setAttribute("aria-selected", String(b.dataset.mode === state.mode));
    });
    $("topic").hidden = state.mode === "progress" || state.mode === "alphabet";
  }
  function renderStats() {
    var words = allWords(state.lang, "All topics");
    $("statDue").textContent = words.filter(isDue).length;
    $("statLearned").textContent = words.filter(function (w) { return rec(w.id).box >= LEARNED_BOX; }).length;
    $("statStreak").textContent = streak();
  }

  // ---------- Flashcards ----------
  var cardQueue = [], card = null, flipped = false, sessionDone = 0;

  function buildCardQueue() {
    var words = allWords(state.lang, state.topic);
    var due = shuffle(words.filter(isDue));
    var fresh = words.filter(isNew).slice(0, 5);
    cardQueue = due.concat(fresh);
    sessionDone = 0;
  }
  function renderCards() {
    if (!card) { card = cardQueue.shift() || null; flipped = false; }
    if (!card) {
      var words = allWords(state.lang, state.topic);
      var left = words.filter(isNew).length;
      panel.innerHTML =
        '<div class="empty"><h3>All caught up</h3>' +
        '<p>' + (sessionDone ? "You reviewed " + sessionDone + " card" + (sessionDone === 1 ? "" : "s") + ". " : "") +
        (left ? left + " new word" + (left === 1 ? "" : "s") + " still waiting in this topic." : "Every word in this topic has been introduced.") + '</p>' +
        (left ? '<button class="btn primary" type="button" id="more">Learn 5 new words</button>' : '<button class="btn" type="button" data-go="quiz">Take a quiz instead</button>') +
        '</div>';
      return;
    }
    var r = rec(card.id);
    var L = LANGS[state.lang];
    panel.innerHTML =
      '<div class="eyebrow"><span>' + esc(card.topic) + '</span><span>' + (cardQueue.length + 1) + ' left · box ' + r.box + '</span></div>' +
      '<div class="card" id="flip" role="button" tabindex="0" aria-label="Flip card">' +
        (r.box === 0 ? '<span class="stampmark">New</span>' : '') +
        '<div><div class="word">' + esc(card.target) + '</div>' +
        (flipped ? '<div class="meaning">' + esc(card.en) + '</div>' + tipHtml(card) : '<div class="hint">Tap to reveal the English</div>') +
        '</div></div>' +
      '<div class="row">' + speakBtn(card.target) + '<span class="note">' + L.name + ' → English</span></div>' +
      '<div class="actions">' +
        '<button class="btn again" type="button" data-rate="0"' + (flipped ? "" : " disabled") + '>Again<small>1</small></button>' +
        '<button class="btn" type="button" data-rate="1"' + (flipped ? "" : " disabled") + '>Good<small>2</small></button>' +
        '<button class="btn primary" type="button" data-rate="2"' + (flipped ? "" : " disabled") + '>Easy<small>3</small></button>' +
      '</div>';
  }
  function flip() { if (card && !flipped) { flipped = true; renderCards(); } }
  function rate(n) {
    if (!card || !flipped) return;
    grade(card, n > 0, n === 2);
    if (n === 0) cardQueue.splice(Math.min(3, cardQueue.length), 0, card);
    sessionDone++;
    card = null;
    renderCards();
  }

  // ---------- Quiz ----------
  var quiz = null;
  function newQuestion() {
    var words = allWords(state.lang, state.topic);
    var pool = words.filter(function (w) { return !isNew(w); });
    if (pool.length < 4) pool = words;
    var due = pool.filter(isDue);
    var w = (due.length ? shuffle(due) : shuffle(pool.slice()))[0];
    var toEnglish = Math.random() < 0.5;
    var distract = shuffle(allWords(state.lang, "All topics").filter(function (x) {
      return x.en !== w.en && x.target !== w.target;
    })).slice(0, 3);
    var opts = shuffle([w].concat(distract));
    quiz = { w: w, toEnglish: toEnglish, opts: opts, answered: false, score: quiz ? quiz.score : 0, total: quiz ? quiz.total : 0 };
  }
  function renderQuiz() {
    if (!quiz) newQuestion();
    var q = quiz, L = LANGS[state.lang];
    var shown = q.toEnglish ? q.w.target : q.w.en;
    panel.innerHTML =
      '<div class="eyebrow"><span>' + (q.toEnglish ? L.name + " → English" : "English → " + L.name) + '</span><span>Score ' + q.score + ' / ' + q.total + '</span></div>' +
      '<div class="prompt"><div class="word">' + esc(shown) + '</div>' + (q.toEnglish ? speakBtn(q.w.target) : "") + '</div>' +
      '<div class="options">' + q.opts.map(function (o, i) {
        var label = q.toEnglish ? o.en : o.target;
        var cls = "";
        if (q.answered) {
          if (o === q.w) cls = " right";
          else if (o === q.picked) cls = " wrong";
        }
        return '<button class="opt' + cls + '" type="button" data-opt="' + i + '"' + (q.answered ? " disabled" : "") + '><span class="k">' + (i + 1) + '</span><span>' + esc(label) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="feedback ' + (q.answered ? (q.picked === q.w ? "good" : "bad") : "") + '">' +
        (q.answered ? (q.picked === q.w ? "Correct!" : "Not quite. It's “" + esc(q.toEnglish ? q.w.en : q.w.target) + "”.") : "") +
      '</div>' +
      (q.answered ? tipHtml(q.w) + '<button class="btn primary" type="button" id="next">Next question</button>' : "");
    if (q.answered) { var n = $("next"); if (n) n.focus(); }
  }
  function answer(i) {
    if (!quiz || quiz.answered) return;
    var o = quiz.opts[i];
    if (!o) return;
    quiz.answered = true; quiz.picked = o; quiz.total++;
    var ok = o === quiz.w;
    if (ok) quiz.score++;
    grade(quiz.w, ok, false);
    if (!quiz.toEnglish || ok) speak(quiz.w.target);
    renderQuiz();
  }

  // ---------- Spell it ----------
  var typ = null;
  function newTyping() {
    var words = allWords(state.lang, state.topic);
    var pool = words.filter(function (w) { return !isNew(w); });
    if (pool.length < 3) pool = words;
    var due = pool.filter(isDue);
    typ = { w: (due.length ? shuffle(due) : shuffle(pool.slice()))[0], result: null, value: "" };
  }
  function renderType() {
    if (!typ) newTyping();
    var L = LANGS[state.lang], t = typ;
    panel.innerHTML =
      '<div class="eyebrow"><span>Write it in ' + L.name + '</span><span>' + esc(t.w.topic) + '</span></div>' +
      '<div class="prompt"><div class="word">' + esc(t.w.en) + '</div></div>' +
      '<form class="typebox" id="typeform" autocomplete="off">' +
        '<input id="typein" type="text" lang="' + state.lang + '" spellcheck="false" autocapitalize="off" placeholder="Type it in Spanish" value="' + esc(t.value) + '"' +
        (t.result ? ' class="' + (t.result === "wrong" ? "bad" : "good") + '" readonly' : "") + '>' +
        (t.result ? '<button class="btn primary" type="button" id="nexttype">Next word</button>' : '<button class="btn primary" type="submit">Check</button>') +
      '</form>' +
      (L.accents.length && !t.result ? '<div class="accents" aria-label="Insert accented letter">' + L.accents.map(function (a) { return '<button type="button" data-ins="' + a + '">' + a + '</button>'; }).join("") + '</div>' : "") +
      '<div class="feedback ' + (t.result === "wrong" ? "bad" : t.result ? "good" : "") + '">' +
        (t.result === "exact" ? "Perfect!" : t.result === "noart" ? "Correct! Learn it with its article, though: “" + esc(t.w.target) + "”" : t.result === "close" ? "Correct, but watch the accents: “" + esc(t.w.target) + "”" : t.result === "wrong" ? "The answer is “" + esc(t.w.target) + "”." : "") +
      '</div>' +
      (t.result ? '<div class="row" style="justify-content:center">' + speakBtn(t.w.target) + '</div>' + tipHtml(t.w) : "") +
      (!t.result ? '<button class="reset" type="button" id="reveal">Show me the answer</button>' : "");
    var inp = $("typein");
    if (inp && !t.result) inp.focus();
    var nx = $("nexttype"); if (nx) nx.focus();
  }
  function checkTyping(giveUp) {
    var v = giveUp ? "" : $("typein").value;
    typ.value = v;
    if (!giveUp && !v.trim()) return;
    var target = typ.w.target;
    var result;
    var bare = target.replace(/^(el|la|los|las) /i, "");
    if (strict(v) === strict(target)) result = "exact";
    else if (bare !== target && (strict(v) === strict(bare) || norm(v) === norm(bare))) result = "noart";
    else if (norm(v) === norm(target)) result = "close";
    else result = "wrong";
    typ.result = result;
    grade(typ.w, result !== "wrong", false);
    speak(target);
    renderType();
  }

  // ---------- Progress ----------
  var confirmReset = false;
  function renderProgress() {
    var L = LANGS[state.lang];
    var colors = { learned: "var(--accent)", learning: "var(--gold)", fresh: "transparent" };
    var topicsHtml = Object.keys(TOPICS).map(function (t) {
      var ws = allWords(state.lang, t);
      var learned = ws.filter(function (w) { return rec(w.id).box >= LEARNED_BOX; }).length;
      var learning = ws.filter(function (w) { var b = rec(w.id).box; return b > 0 && b < LEARNED_BOX; }).length;
      var pct = function (n) { return (n / ws.length * 100).toFixed(1) + "%"; };
      return '<div class="topic"><span class="name">' + esc(t) + '</span>' +
        '<div class="bar" role="img" aria-label="' + learned + ' learned, ' + learning + ' in progress of ' + ws.length + '">' +
        '<span style="width:' + pct(learned) + ';background:' + colors.learned + '"></span>' +
        '<span style="width:' + pct(learning) + ';background:' + colors.learning + '"></span></div>' +
        '<span class="num">' + learned + '/' + ws.length + '</span></div>';
    }).join("");

    var seen = allWords(state.lang, "All topics").filter(function (w) { return !isNew(w); })
      .sort(function (a, b) { return rec(b.id).box - rec(a.id).box; });
    var tableHtml = seen.length
      ? '<div class="tablewrap"><table><thead><tr><th>' + L.name + '</th><th>English</th><th>Box</th><th>Next review</th></tr></thead><tbody>' +
        seen.map(function (w) {
          var r = rec(w.id);
          var days = Math.ceil((r.due - Date.now()) / DAY);
          var when = days <= 0 ? "due now" : days === 1 ? "tomorrow" : "in " + days + " days";
          return '<tr><td>' + esc(w.target) + '</td><td>' + esc(w.en) + '</td><td class="box">' + "●".repeat(r.box) + "○".repeat(MAX_BOX - r.box) + '</td><td>' + when + '</td></tr>';
        }).join("") + '</tbody></table></div>'
      : '<p class="note">No ' + L.name + ' words studied yet. Start with Flashcards.</p>';

    panel.innerHTML =
      '<div class="eyebrow"><span>' + L.name + ' progress</span><span>' + seen.length + ' of ' + allWords(state.lang, "All topics").length + ' words started</span></div>' +
      '<div class="topics">' + topicsHtml + '</div>' +
      '<div class="legend"><span><i style="background:var(--accent)"></i>Learned (box ' + LEARNED_BOX + '+)</span><span><i style="background:var(--gold)"></i>In progress</span><span><i style="background:var(--line)"></i>Not started</span></div>' +
      tableHtml +
      (confirmReset
        ? '<div class="confirm"><span>Erase all ' + L.name + ' progress?</span><button class="btn again" type="button" id="doreset">Erase</button><button class="btn" type="button" id="cancelreset">Keep it</button></div>'
        : '<button class="reset" type="button" id="askreset">Reset ' + L.name + ' progress</button>');
  }

  // ---------- Alphabet (Spanish) ----------
  if (!state.alpha) state.alpha = {};
  var alphaView = "learn", alphaSel = 0, aq = null;

  function alphaRec(letter) { return state.alpha[letter] || { streak: 0, seen: 0 }; }
  function alphaLevel(letter) {
    var r = alphaRec(letter);
    return r.streak >= ALPHA_KNOWN ? "known" : r.seen > 0 ? "learning" : "";
  }
  function speakEs(text) {
    var keep = state.lang; state.lang = "es"; speak(text); state.lang = keep;
  }

  function renderAlphabet() {
    var known = ALPHABET.filter(function (a) { return alphaLevel(a[0]) === "known"; }).length;
    var head =
      '<div class="eyebrow"><span>The Spanish alphabet · 27 letters</span><span>' + known + ' / 27 known</span></div>' +
      '<div class="subtabs">' +
        '<button class="subtab" type="button" data-aview="learn" aria-pressed="' + (alphaView === "learn") + '">Letter chart</button>' +
        '<button class="subtab" type="button" data-aview="quiz" aria-pressed="' + (alphaView === "quiz") + '">Letter quiz</button>' +
      '</div>';
    panel.innerHTML = head + (alphaView === "learn" ? alphaLearnHtml() : alphaQuizHtml());
    if (alphaView === "quiz" && aq && aq.answered) { var n = $("anext"); if (n) n.focus(); }
  }

  function alphaLearnHtml() {
    var a = ALPHABET[alphaSel];
    var tiles = ALPHABET.map(function (l, i) {
      var lvl = alphaLevel(l[0]);
      return '<button class="letter' + (l[0] === "Ñ" ? " special" : "") + '" type="button" data-letter="' + i + '" aria-pressed="' + (i === alphaSel) + '" aria-label="' + l[0] + ', ' + l[1] + '">' +
        l[0] + '<span class="dot ' + lvl + '"></span></button>';
    }).join("");
    var examples = '<b>' + esc(a[3]) + '</b> (' + esc(a[4]) + ')' + (a[5] ? ', <b>' + esc(a[5]) + '</b> (' + esc(a[6]) + ')' : "");
    var sayBtns = canSpeak
      ? '<div class="say"><button class="speak" type="button" data-sayes="' + esc(a[1]) + '">' + ICON_SPEAK + 'Say “' + esc(a[1]) + '”</button>' +
        '<button class="speak" type="button" data-sayes="' + esc(a[3]) + '">' + ICON_SPEAK + esc(a[3]) + '</button>' +
        (a[5] ? '<button class="speak" type="button" data-sayes="' + esc(a[5]) + '">' + ICON_SPEAK + esc(a[5]) + '</button>' : "") + '</div>'
      : "";
    return '<div class="letters">' + tiles + '</div>' +
      '<div class="detail">' +
        '<div class="big">' + a[0] + a[0].toLowerCase() + '</div>' +
        '<div class="name">' + esc(a[1]) + '<small>letter name</small></div>' +
        sayBtns +
        '<dl><dt>Sound</dt><dd>' + a[2] + '</dd><dt>Example</dt><dd>' + examples + '</dd></dl>' +
      '</div>' +
      '<div class="eyebrow"><span>Letter pairs with their own sound</span></div>' +
      '<div class="digraphs">' + DIGRAPHS.map(function (d) {
        return '<div class="digraph"><b>' + d[0] + '</b>' + esc(d[1]) + '<span>' + esc(d[2]) + '</span></div>';
      }).join("") + '</div>' +
      '<p class="note">Tap a letter to learn it. Use ← and → to move along the alphabet. Dots show your quiz progress: yellow for learning, pink for known.</p>';
  }

  function newAlphaQuestion() {
    // Favour letters that aren't known yet.
    var weak = ALPHABET.filter(function (a) { return alphaLevel(a[0]) !== "known"; });
    var pool = weak.length && Math.random() < 0.8 ? weak : ALPHABET;
    var target = shuffle(pool.slice())[0];
    var others = shuffle(ALPHABET.filter(function (a) { return a !== target; })).slice(0, 3);
    var kind = canSpeak ? ["hear", "name", "word"][Math.floor(Math.random() * 3)] : (Math.random() < 0.5 ? "name" : "word");
    aq = { t: target, kind: kind, opts: shuffle([target].concat(others)), answered: false, picked: null,
           score: aq ? aq.score : 0, total: aq ? aq.total : 0 };
    if (kind === "hear") speakEs(target[1]);
  }

  function alphaQuizHtml() {
    if (!aq) newAlphaQuestion();
    var q = aq, prompt, label;
    if (q.kind === "hear") {
      prompt = '<div class="word">Which letter is this?</div><button class="speak" type="button" data-sayes="' + esc(q.t[1]) + '">' + ICON_SPEAK + 'Play again</button>';
      label = function (o) { return o[0]; };
    } else if (q.kind === "name") {
      prompt = '<div class="word" style="font-size:clamp(56px,14vw,80px)">' + q.t[0] + '</div><div class="note">What is this letter called?</div>';
      label = function (o) { return o[1]; };
    } else {
      var blank = q.t[3].replace(new RegExp(q.t[0], "i"), "_");
      prompt = '<div class="word">' + esc(blank) + '</div><div class="note">Which letter completes the word for “' + esc(q.t[4]) + '”?</div>';
      label = function (o) { return o[0]; };
    }
    var letterOpts = q.kind !== "name";
    return '<div class="eyebrow"><span>' + (q.kind === "hear" ? "Listen" : q.kind === "name" ? "Letter names" : "Fill the gap") + '</span><span>Score ' + q.score + ' / ' + q.total + '</span></div>' +
      '<div class="prompt">' + prompt + '</div>' +
      '<div class="options">' + q.opts.map(function (o, i) {
        var cls = "";
        if (q.answered) { if (o === q.t) cls = " right"; else if (o === q.picked) cls = " wrong"; }
        return '<button class="opt' + (letterOpts ? " letteropt" : "") + cls + '" type="button" data-aopt="' + i + '"' + (q.answered ? " disabled" : "") + '><span class="k">' + (i + 1) + '</span><span>' + esc(label(o)) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="feedback ' + (q.answered ? (q.picked === q.t ? "good" : "bad") : "") + '">' +
        (q.answered ? (q.picked === q.t ? "Correct! " : "Not quite. ") + q.t[0] + ' is called “' + esc(q.t[1]) + '”, as in ' + esc(q.t[3]) + '.' : "") +
      '</div>' +
      (q.answered ? '<button class="btn primary" type="button" id="anext">Next letter</button>' : "");
  }

  function alphaAnswer(i) {
    if (!aq || aq.answered) return;
    var o = aq.opts[i]; if (!o) return;
    aq.answered = true; aq.picked = o; aq.total++;
    var ok = o === aq.t;
    if (ok) aq.score++;
    var r = alphaRec(aq.t[0]);
    r.seen++; r.streak = ok ? r.streak + 1 : 0;
    state.alpha[aq.t[0]] = r;
    var d = todayKey();
    if (state.days[state.days.length - 1] !== d) state.days.push(d);
    save(); renderStats();
    speakEs(aq.t[3]);
    renderAlphabet();
  }

  // ---------- Router ----------
  function render() {
    renderTabs(); renderStats();
    if (state.mode === "cards") renderCards();
    else if (state.mode === "quiz") renderQuiz();
    else if (state.mode === "type") renderType();
    else if (state.mode === "alphabet") renderAlphabet();
    else renderProgress();
  }
  function resetSessions() { card = null; quiz = null; typ = null; confirmReset = false; buildCardQueue(); }

  // ---------- Events ----------
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-mode]"); if (!b) return;
    state.mode = b.dataset.mode; save(); confirmReset = false;
    if (state.mode === "cards" && !card && !cardQueue.length) buildCardQueue();
    render();
  });
  $("topic").addEventListener("change", function (e) {
    state.topic = e.target.value; save(); resetSessions(); render();
  });

  panel.addEventListener("click", function (e) {
    var t = e.target;
    var say = t.closest("[data-say]"); if (say) { speak(say.dataset.say); return; }
    if (t.closest("#flip")) { flip(); return; }
    var r = t.closest("[data-rate]"); if (r) { rate(Number(r.dataset.rate)); return; }
    if (t.closest("#more")) {
      var fresh = allWords(state.lang, state.topic).filter(isNew).slice(0, 5);
      cardQueue = cardQueue.concat(fresh); renderCards(); return;
    }
    var go = t.closest("[data-go]"); if (go) { state.mode = go.dataset.go; save(); render(); return; }
    var o = t.closest("[data-opt]"); if (o) { answer(Number(o.dataset.opt)); return; }
    if (t.closest("#next")) { newQuestion(); renderQuiz(); return; }
    var ins = t.closest("[data-ins]");
    if (ins) {
      var inp = $("typein");
      var s = inp.selectionStart || inp.value.length, en = inp.selectionEnd || s;
      inp.value = inp.value.slice(0, s) + ins.dataset.ins + inp.value.slice(en);
      inp.focus(); inp.setSelectionRange(s + 1, s + 1); return;
    }
    if (t.closest("#reveal")) { checkTyping(true); return; }
    if (t.closest("#nexttype")) { newTyping(); renderType(); return; }
    if (t.closest("#askreset")) { confirmReset = true; renderProgress(); return; }
    if (t.closest("#cancelreset")) { confirmReset = false; renderProgress(); return; }
    var sayEs = t.closest("[data-sayes]"); if (sayEs) { speakEs(sayEs.dataset.sayes); return; }
    var av = t.closest("[data-aview]"); if (av) { alphaView = av.dataset.aview; renderAlphabet(); return; }
    var lt = t.closest("[data-letter]");
    if (lt) { alphaSel = Number(lt.dataset.letter); speakEs(ALPHABET[alphaSel][1]); renderAlphabet(); var f = panel.querySelector('[data-letter="' + alphaSel + '"]'); if (f) f.focus(); return; }
    var ao = t.closest("[data-aopt]"); if (ao) { alphaAnswer(Number(ao.dataset.aopt)); return; }
    if (t.closest("#anext")) { newAlphaQuestion(); renderAlphabet(); return; }
    if (t.closest("#doreset")) {
      Object.keys(state.words).forEach(function (k) { if (k.indexOf(state.lang + "|") === 0) delete state.words[k]; });
      save(); resetSessions(); render(); return;
    }
  });
  panel.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "typeform" && typ && !typ.result) checkTyping(false);
  });

  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (state.mode === "cards") {
      if ((e.key === " " || e.key === "Enter") && card && !flipped) { e.preventDefault(); flip(); }
      else if (flipped && /^[123]$/.test(e.key)) rate(Number(e.key) - 1);
    } else if (state.mode === "alphabet") {
      if (alphaView === "learn" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
        e.preventDefault();
        alphaSel = (alphaSel + (e.key === "ArrowRight" ? 1 : ALPHABET.length - 1)) % ALPHABET.length;
        speakEs(ALPHABET[alphaSel][1]); renderAlphabet();
        var f = panel.querySelector('[data-letter="' + alphaSel + '"]'); if (f) f.focus();
      } else if (alphaView === "quiz" && aq && !aq.answered && /^[1-4]$/.test(e.key)) alphaAnswer(Number(e.key) - 1);
    } else if (state.mode === "quiz" && quiz) {
      if (!quiz.answered && /^[1-4]$/.test(e.key)) answer(Number(e.key) - 1);
    }
  });

  // ---------- Start ----------
  renderTopics(); buildCardQueue(); render();
})();
</script>
</body>
</html>
